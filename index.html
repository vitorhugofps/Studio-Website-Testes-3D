<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Studio — testes de sites 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b0c0e; --fg: #f4f5f6; --muted: #8b9096; --line: #23262b; --accent: #02d2e3; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; background: var(--bg); color: var(--fg); font-family: "Space Grotesk", system-ui, sans-serif; display: flex; flex-direction: column; }
  main { width: min(960px, 100% - 48px); margin: 0 auto; padding: 72px 0 48px; flex: 1; }
  .eyebrow { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 12px 0 40px; font-size: clamp(32px, 6vw, 56px); line-height: 1; letter-spacing: -0.02em; font-weight: 700; }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  li { border-bottom: 1px solid var(--line); }
  a { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 16px; padding: 24px 0; color: inherit; text-decoration: none; }
  .num { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .name { font-size: clamp(20px, 3vw, 28px); font-weight: 500; }
  .meta { display: block; margin-top: 6px; font-size: 13px; color: var(--muted); }
  .go { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); transition: color 150ms, transform 150ms; }
  a:hover .name, a:focus-visible .name, a:hover .go, a:focus-visible .go { color: var(--accent); }
  a:hover .go { transform: translateX(4px); }
  a:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }
  footer { width: min(960px, 100% - 48px); margin: 0 auto; padding: 24px 0 32px; font-size: 12px; color: var(--muted); }
  @media (max-width: 560px) { a { grid-template-columns: 36px 1fr; } .go { display: none; } }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Studio Impacto</p>
  <h1>Testes de sites 3D</h1>
  <ul>
    <li><a href="/kimi"><span class="num">02</span><span><span class="name">Kimi Antonelli — GRIDO1</span><span class="meta">three.js · Lenis · capacete com reveal no cursor, circuito, timeline</span></span><span class="go">Abrir →</span></a></li>
    <li><a href="/soda"><span class="num">01</span><span><span class="name">Diet Soda — Pure Zero</span><span class="meta">GSAP · model-viewer · lata 3D, frutas que fogem do cursor, troca de sabor</span></span><span class="go">Abrir →</span></a></li>
  </ul>
</main>
<footer>Uso interno — previews de teste, não indexados.</footer>
</body>
</html>
